[package]
name = "jargon-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Absensi Face Recognition API - Dinas Pendidikan Provinsi Sumatera Utara"
license = "MIT"

[[bin]]
name = "jargon-api"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.9", features = ["macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["typed-header", "cookie"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
dashmap = "6.2.1"
dotenvy = "0.15.7"
futures = "0.3.34"
hmac = "0.12.1"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png"] }
jsonwebtoken = "9.3.1"
lettre = { version = "0.11.19", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
once_cell = "1.21.4"
parking_lot = "0.12.5"
pgvector = { version = "0.4.2", features = ["sqlx"] }
rand = "0.9.5"
redis = { version = "0.32.7", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "multipart", "charset", "http2", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace", "cors", "compression-gzip", "request-id", "timeout", "limit", "normalize-path", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
urlencoding = "2.1.3"
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid", "preserve_order"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.20.0", features = ["v4", "v7", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }
